# Prefix

set -g prefix C-b

# TPM plugins

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect / Continuum settings

set -g @continuum-save-interval '15'

set -g @continuum-restore 'on'

set -g @resurrect-capture-pane-contents 'on'

set -g mouse 'on'

# Swap panes with Shift-arrow

bind -n S-Left swap-pane -U

bind -n S-Right swap-pane -D

bind -n S-M-Down split-window -v -f -c "#{pane_current_path}"
bind -n S-M-Right split-window -h -f -c "#{pane_current_path}"

bind -n S-Enter run-shell "tmux send-keys '\n'"

# Notification badges on window tabs (@noti is bumped by ~/.local/bin/tmux-badge
# from Claude Code hooks; visiting the window clears it)

set -g window-status-format '#I:#W#{window_flags}#{?#{@noti},#[fg=colour231#,bg=colour160#,bold] #{@noti} #[default],}'

set-hook -g session-window-changed 'set -w @noti 0'

# Initialize TPM - must stay at the bottom

run-shell '~/.tmux/plugins/tpm/tpm'

